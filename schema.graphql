  terminationKind: TerminationKind

  """Lifecycle statuses over time, newest first."""
  statusHistory: [StatusRecord!]!

  """HR notes, newest first. Empty unless you may manage this employee."""
  notes: [EmployeeNote!]!

  """Pay history, newest first. Empty unless you may see pay."""
  compensationHistory: [Compensation!]!

  """Empty unless you are the employee or may view employee records."""
  emergencyContacts: [EmergencyContact!]!

  """
  Bank and ID details with the numbers masked. Null unless you may see them.
  """
  privateDetails: PrivateDetails

  """
  What you may do with each group of this employee's fields: none, view or edit.
  """
  fieldAccess: JSON!

  """Custom field values you may see, in field order, including empty ones."""
