type Query {
  """The organization on this web address, or null on the platform address."""
  tenant: TenantPublic

  """The signed-in user in this organization, or null."""
  me: Me
  legalEntities: [LegalEntity!]!
  locations: [Location!]!
  departments: [Department!]!
  jobTitles: [JobTitle!]!
  grades: [Grade!]!
  employees(filter: EmployeeFilter = null, first: Int! = 50, after: String = null): EmployeeConnection!
  employee(id: ID!): Employee!
  leaveTypes(includeInactive: Boolean! = false): [LeaveType!]!
  leavePolicies: [LeavePolicy!]!

  """
  Holidays in a year. HR sees every location; others see their own and company-wide ones.
  """
  publicHolidays(year: Int!): [PublicHoliday!]!

  """Balances, requests and ledger. Without employeeId: your own."""
  employeeLeave(employeeId: ID = null): EmployeeLeave!

  """What a request would use, and what would be left, before it is made."""
  leaveQuote(leaveTypeId: ID!, startDate: Date!, endDate: Date!, halfDay: Boolean! = false, employeeId: ID = null): LeaveQuote!

  """
  Requests waiting for you (or someone you cover). HR can ask for every pending request.
  """
  leaveApprovals(everyone: Boolean! = false): [LeaveRequestType!]!

  """Who is away between two dates (LV-06), with public holidays."""
  leaveCalendar(start: Date!, end: Date!, departmentId: ID = null): LeaveCalendar!

  """Your approval delegations that are current or upcoming."""
  myDelegations: [Delegation!]!

  """Your notifications, newest first."""
  notifications(unreadOnly: Boolean! = false, first: Int! = 20, after: String = null): NotificationConnection!
  unreadNotificationCount: Int!
}

