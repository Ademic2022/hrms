  """A ten-minute download link. Each one is recorded in the audit log."""
  documentDownloadUrl(id: ID!): String!
  saveEmergencyContact(input: EmergencyContactInput!): EmergencyContactPayload!
  deleteEmergencyContact(id: ID!): Boolean!
  savePrivateDetails(input: PrivateDetailsInput!): PrivateDetailsPayload!

  """
  The bank and ID numbers in full. Each reveal is written to the audit log.
  """
  revealPrivateDetails(employeeId: ID!): PrivateDetails!
  saveCustomField(input: SaveCustomFieldInput!): CustomFieldPayload!

  """Set custom field values by key. Null or empty clears a value."""
  setEmployeeCustomValues(employeeId: ID!, values: JSON!): CustomValuesPayload!
