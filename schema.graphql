  saveLeavePolicy(input: SaveLeavePolicyInput!): LeavePolicyPayload!
  savePublicHoliday(input: SavePublicHolidayInput!): PublicHolidayPayload!
  deletePublicHoliday(id: ID!): Boolean!
  delegateApprovals(input: DelegateInput!): DelegationPayload!
  revokeDelegation(id: ID!): DelegationPayload!

